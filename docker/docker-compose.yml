services:
  ollama:
    image: ollama/ollama@sha256:<pinned-digest>
    runtime: nvidia
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=-1
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 6
      start_period: 15s

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "8501:8501"
    runtime: nvidia
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434