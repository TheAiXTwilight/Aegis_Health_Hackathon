[pytest]
testpaths = tests
asyncio_mode = auto

markers =
    unit: fast tests
    integration: integration tests
    benchmark: performance tests
    placeholder: temporary tests tied to placeholder implementations
    ollama: tests requiring a live Ollama instance with aegis-llama loaded
    whisper: tests requiring a real Whisper model
    piper: tests requiring a real Piper TTS voice model
    xray: tests requiring real torchxrayvision model weights

addopts = -ra